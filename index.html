<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EdzőNapló</title>
<style>
:root{
  --navy:#1a2d5a;--navy2:#213570;--blue:#2563eb;--accent:#7bb8ff;
  --bg:#f0f4fb;--card:#fff;--line:#dde6f2;--text:#0f1e3d;--muted:#667594;
  --green:#047857;--greenbg:#e8f7ef;--yellow:#9a6500;--yellowbg:#fff8e8;--red:#c73535;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.hdr{background:linear-gradient(145deg,var(--navy),#294ec1);color:#fff;padding:0 max(16px,calc((100vw - 820px)/2));position:sticky;top:0;z-index:50;box-shadow:0 5px 24px #14234b22}
.hdr-row{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{background:none;color:#fff;font-size:21px;font-weight:900;letter-spacing:-.5px}.logo em{font-style:normal;color:var(--accent)}.hdr-sub{font-size:12px;color:#c9d9f7;font-weight:700}.save-state{font-size:11px;color:#c9d9f7}
main{max-width:856px;margin:0 auto;padding:22px 16px calc(110px + env(safe-area-inset-bottom,0))}
.eyebrow{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px}.page-title{font-size:29px;line-height:1.15;letter-spacing:-.7px;margin-bottom:7px}.page-sub{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:22px}
.day-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.day-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;min-height:135px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 14px #1a2d5a0b;transition:.15s}.day-card:active{transform:scale(.985)}.day-card:last-child:nth-child(odd){grid-column:1/-1}.day-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px}.day-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}.ic-push{background:#f4ecff;color:#7c3aed}.ic-pull{background:#eaf8ee;color:#168449}.ic-leg{background:#fff0f0;color:#d23b3b}.ic-upper{background:#eaf2ff;color:#2563eb}.ic-lower{background:#fff3e8;color:#e66b18}.day-card h2{font-size:18px;margin-bottom:3px}.day-card p{font-size:12px;color:var(--muted)}.day-last{margin-top:12px;font-size:12px;font-weight:800;color:var(--green)}
.focus{background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;border-radius:20px;padding:20px;margin-bottom:13px}.focus-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.back-btn{background:#ffffff18;color:#fff;border:1px solid #ffffff28;border-radius:11px;padding:8px 11px;font-size:13px;font-weight:800}.focus h1{font-size:27px;letter-spacing:-.6px;margin-top:7px}.focus p{font-size:13px;color:#d8e4ff;margin-top:4px}.chips{display:flex;gap:7px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:8px 12px;font-size:12px;font-weight:850}.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.session{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.session p{font-size:13px;color:var(--muted);margin-bottom:10px}.btn-row{display:flex;gap:8px}.btn{flex:1;border-radius:11px;min-height:44px;padding:10px 12px;font-weight:850;font-size:14px}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.light{background:#edf2f8;color:var(--text)}.red{background:#fff0f1;color:var(--red)}
.progress-text{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:15px 2px 7px}.progress-text strong{color:var(--text)}.track{height:6px;background:#dfe6f0;border-radius:99px;overflow:hidden;margin-bottom:12px}.track>div{height:100%;background:var(--green);border-radius:99px;transition:width .15s}
.exercise{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 14px 11px}.ex-name{font-size:16px;font-weight:900}.rest{background:#edf2f8;color:var(--text);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:850}.col-head,.set-row{display:grid;grid-template-columns:25px minmax(0,1fr) minmax(0,1fr) 54px 42px;gap:6px;align-items:center}.col-head{padding:0 12px 6px;font-size:10px;font-weight:850;color:var(--muted);text-align:center;text-transform:uppercase}.set-wrap{padding:0 12px 12px}.set-row{margin-top:6px}.set-no{text-align:center;font-size:13px;color:var(--muted);font-weight:800}.set-inp{width:100%;height:45px;border:1.5px solid transparent;border-radius:9px;background:#edf2f8;text-align:center;outline:0;font-size:17px;font-weight:850;color:var(--text);padding:0 4px}.set-inp:focus{background:#eef5ff;border-color:var(--blue);color:var(--blue)}.rir{background:var(--yellowbg);color:var(--yellow)}.done{height:45px;border-radius:9px;background:#edf2f8;color:#6b7b98;font-size:22px;border:1px solid #d8e1ef}.done.checked{background:var(--green);color:#fff;border-color:var(--green)}.set-row.is-done .set-inp:not(.rir){background:var(--greenbg);color:#115735}.previous{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0 0 31px;min-height:24px;font-size:11px;color:var(--muted)}.copy{flex:none;background:#edf3ff;color:#1d4ed8;border-radius:7px;padding:5px 7px;font-size:11px;font-weight:800}
.empty-prev{color:#95a2b9}.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:13px}.summary h2{font-size:18px;margin-bottom:10px}.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#edf2f8;border-radius:11px;padding:11px}.metric span{display:block;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.metric strong{font-size:19px;display:block;margin-top:3px}.summary-note{margin-top:9px;background:var(--greenbg);color:#17603f;border-radius:10px;padding:9px 10px;font-size:12px;font-weight:750}
.settings-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.settings-card h2{font-size:18px;margin-bottom:6px}.helper{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:12px}.settings-day{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.settings-day>strong{display:block;margin-bottom:8px}.settings-ex{display:grid;grid-template-columns:1fr 68px;gap:7px;margin-bottom:7px}.edit{width:100%;height:42px;border:1px solid var(--line);background:#f7f9fc;border-radius:9px;padding:0 9px;color:var(--text)}.danger-actions{display:flex;gap:6px;margin-bottom:9px}.danger-actions button{flex:1}.add-row{display:grid;grid-template-columns:1fr 78px;gap:7px;margin-top:8px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0));width:min(824px,calc(100% - 24px));background:#1a2d5af2;color:#fff;border-radius:15px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:80;box-shadow:0 10px 28px #0f1e3d45;backdrop-filter:blur(10px)}.timer.done{background:#047857f2}.timer small{display:block;color:#cad8f5;font-size:10px;font-weight:800;max-width:50vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer strong{font-size:23px}.timer-actions{display:flex;gap:6px}.timer-actions button{background:#ffffff18;color:#fff;border-radius:9px;padding:8px 10px;font-weight:850}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:70;padding-bottom:env(safe-area-inset-bottom,0)}.bnav button{flex:0 1 190px;min-height:68px;background:none;color:var(--muted);font-size:12px;font-weight:850}.bnav button.active{color:var(--blue)}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-10px);background:var(--green);color:#fff;border-radius:11px;padding:9px 16px;font-size:13px;font-weight:850;opacity:0;pointer-events:none;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.warn{background:#b77900}.toast.red{background:var(--red)}
@media(max-width:520px){main{padding-left:12px;padding-right:12px}.day-grid{gap:9px}.day-card{padding:15px;min-height:125px}.page-title{font-size:27px}.col-head,.set-row{grid-template-columns:21px minmax(0,1fr) minmax(0,1fr) 48px 40px;gap:5px}.set-wrap,.col-head{padding-left:9px;padding-right:9px}.set-inp{font-size:16px}.previous{margin-left:26px}.ex-head{padding-left:11px;padding-right:11px}.ex-name{font-size:15px}}
</style>
</head>
<body>
<div class="toast" id="toast">Mentve ✓</div>
<div id="app"></div>
<script>
const STORAGE_KEY='edzes_simple_v1';
const LEGACY_KEY='edzes_v6';
const ICONS={
 push:'<circle cx="12" cy="12" r="10"/><polyline points="12 8 16 12 12 16"/><line x1="8" y1="12" x2="16" y2="12"/>',
 pull:'<circle cx="12" cy="12" r="10"/><polyline points="12 16 8 12 12 8"/><line x1="16" y1="12" x2="8" y2="12"/>',
 leg:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
 upper:'<path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/>',
 lower:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'
};
const DEFAULT_PROGRAM=[
 {id:'push',name:'Push',ic:'ic-push',icon:'push',exercises:[{name:'Fekvenyomás gépen',sets:2},{name:'Vállból nyomás',sets:2},{name:'Tárogatás',sets:2},{name:'Oldalemelés',sets:2},{name:'Tricepsz letolás csigán 1 kézzel',sets:2},{name:'Tricepsz fejfölött',sets:2}]},
 {id:'pull',name:'Pull',ic:'ic-pull',icon:'pull',exercises:[{name:'Lehúzás két kézzel gépen',sets:2},{name:'Evezés szűk fogással',sets:2},{name:'Súlyzós bicepsz',sets:2},{name:'T-rúdas evezés',sets:2},{name:'Kalapács bicepsz',sets:2}]},
 {id:'leg',name:'Leg',ic:'ic-leg',icon:'leg',exercises:[{name:'Hack guggolás (gumi assist)',sets:2},{name:'Combhajlító',sets:2},{name:'Combfeszítő',sets:2},{name:'Vádli',sets:3},{name:'Comb tárogatás',sets:2},{name:'Hasazás',sets:3}]},
 {id:'upper',name:'Felső test',ic:'ic-upper',icon:'upper',exercises:[{name:'Fekvenyomás gépen',sets:2},{name:'Lehúzás két kézzel gépen',sets:2},{name:'Evezés szűk/széles fogással gépen',sets:2},{name:'Vállból nyomás',sets:2},{name:'Tricepsz letolás csigán 1 kézzel',sets:2},{name:'Bicepsz gépen',sets:2}]},
 {id:'lower',name:'Alsó test',ic:'ic-lower',icon:'lower',exercises:[{name:'RDL',sets:2},{name:'Bolgár guggolás',sets:2},{name:'Combhajlító',sets:2},{name:'Vádli',sets:3},{name:'Comb tárogatás',sets:2},{name:'Hasazás',sets:3}]}
];
let S={view:'home',activeDay:'',program:clone(DEFAULT_PROGRAM),history:{},drafts:{},session:null,prefs:{rest:90,autoRest:true},timer:{end:0,label:''},lastSummary:null};
let toastT,timerT;
function clone(x){return JSON.parse(JSON.stringify(x))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function day(id){return S.program.find(d=>d.id===id)||S.program[0]}
function icon(d){return `<svg viewBox="0 0 24 24">${ICONS[d.icon]||ICONS.upper}</svg>`}
function load(){
 try{
   const raw=localStorage.getItem(STORAGE_KEY);
   if(raw){S={...S,...JSON.parse(raw),prefs:{...S.prefs,...JSON.parse(raw).prefs}};return}
   migrateLegacy();
 }catch(e){console.error(e)}
}
function migrateLegacy(){
 try{
   const raw=localStorage.getItem(LEGACY_KEY);if(!raw)return;
   const old=JSON.parse(raw);if(!old||!Array.isArray(old.program))return;
   const idMap={hetfo:'leg',szerda:'upper',csutortok:'lower',szombat:'push',vasarnap:'pull'};
   const migrated={};
   if(Array.isArray(old.workouts)){
     for(const w of old.workouts){const nid=idMap[w.dayId];if(!nid||!Array.isArray(w.sets))continue;const stamp=new Date(w.finishedAt||w.startedAt||0).getTime();if(!migrated[nid]||stamp>migrated[nid].stamp)migrated[nid]={stamp,sets:w.sets};}
   }
   for(const [nid,obj] of Object.entries(migrated)){
     const result={};for(const r of obj.sets){result[r.exercise]??=[];result[r.exercise][Math.max(0,(r.set||1)-1)]={suly:r.suly,ism:r.ism,rir:r.rir??''};}
     S.history[nid]=result;
   }
   S.prefs={...S.prefs,...(old.prefs||{})};save(true);
 }catch(e){console.warn('Régi adatok migrációja sikertelen',e)}
}
function save(silent=false){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));if(!silent)toast('Mentve ✓')}catch(e){toast('Nem sikerült menteni','red')}}
function toast(msg,cls=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+cls;clearTimeout(toastT);toastT=setTimeout(()=>el.className='toast',1500)}
function render(){document.getElementById('app').innerHTML=header()+({home:homeView,workout:workoutView,settings:settingsView}[S.view]||homeView)()+floatingTimer()+bnav();attach();scheduleTimer();renderTimer()}
function header(){return `<header class="hdr"><div class="hdr-row"><button class="logo" data-home>Edző<em>Napló</em></button><div style="text-align:right"><div class="hdr-sub">${S.view==='workout'?'Edzés':S.view==='settings'?'Beállítások':'Edzésválasztó'}</div><div class="save-state">Mentve ezen az eszközön</div></div></div></header>`}
function homeView(){return `<main><div class="eyebrow">Válaszd ki, mit edzel ma</div><h1 class="page-title">Milyen nap van?</h1><p class="page-sub">Nincs hét, ciklus vagy dátum. Az adott edzésnél mindig a legutóbbi eredményeidet látod viszonyításként.</p><section class="day-grid">${S.program.map(d=>`<button class="day-card" data-open="${d.id}"><div><span class="day-icon ${d.ic}">${icon(d)}</span><h2>${esc(d.name)}</h2><p>${d.exercises.length} gyakorlat</p></div><div class="day-last">${S.history[d.id]?'Van előző edzés →':'Első edzés →'}</div></button>`).join('')}</section></main>`}
function chips(){return `<div class="chips">${S.program.map(d=>`<button class="chip ${d.id===S.activeDay?'active':''}" data-switch="${d.id}" ${S.session&&S.session.dayId!==d.id?'disabled':''}>${esc(d.name)}</button>`).join('')}</div>`}
function workoutView(){const d=day(S.activeDay),active=S.session?.dayId===d.id,draft=S.drafts[d.id]||{},p=progress(d,draft);return `<main><section class="focus"><div class="focus-top"><div><div class="eyebrow" style="color:#cbdcff">Kiválasztott edzés</div><h1>${esc(d.name)}</h1><p>${d.exercises.length} gyakorlat · előző edzés értékeivel</p></div><button class="back-btn" data-home>← Vissza</button></div></section>${chips()}<section class="session"><p>${active?'Edzés folyamatban. A beírt adatok automatikusan mentődnek.':S.history[d.id]?'Az előző edzésed megvan. Indítsd el a következőt, és abból dolgozz tovább.':'Ehhez az edzéshez még nincs korábbi eredmény.'}</p><div class="btn-row">${active?`<button class="btn green" id="finish">Edzés befejezése</button><button class="btn red" id="cancel">Megszakítás</button>`:`<button class="btn primary" id="start">Edzés indítása</button>`}</div></section><div class="progress-text"><strong>${p.done}/${p.total} sorozat kész</strong><span>Előző érték közvetlenül alatta</span></div><div class="track"><div style="width:${p.total?p.done/p.total*100:0}%"></div></div>${d.exercises.map(ex=>exerciseBlock(d,ex,active)).join('')}${S.lastSummary&&S.lastSummary.dayId===d.id?summary(S.lastSummary):''}</main>`}
function exerciseBlock(d,ex,editable){const draft=S.drafts[d.id]?.[ex.name]||[],prev=S.history[d.id]?.[ex.name]||[];let rows='';for(let i=0;i<ex.sets;i++){const c=draft[i]||{},p=prev[i]||{},done=valid(c)&&c.done===true;const attrs=`data-day="${d.id}" data-ex="${esc(ex.name)}" data-set="${i}"`;rows+=`<div class="set-row ${done?'is-done':''}"><div class="set-no">${i+1}</div><input class="set-inp" type="number" inputmode="decimal" min="0" step="any" placeholder="kg" value="${esc(c.suly??'')}" ${attrs} data-field="suly" ${editable?'':'disabled'}><input class="set-inp" type="number" inputmode="numeric" min="1" step="1" placeholder="ism." value="${esc(c.ism??'')}" ${attrs} data-field="ism" ${editable?'':'disabled'}><select class="set-inp rir" ${attrs} data-field="rir" ${editable?'':'disabled'}><option value="">–</option>${[0,1,2,3,4,5].map(x=>`<option value="${x}" ${String(c.rir??'')===String(x)?'selected':''}>${x}</option>`).join('')}</select><button class="done ${done?'checked':''}" ${attrs} data-done ${editable?'':'disabled'}>${done?'✓':'○'}</button></div><div class="previous"><span class="${p.ism?'':'empty-prev'}">${p.ism?`Előző: ${esc(p.suly)} kg × ${esc(p.ism)}${p.rir!==''&&p.rir!==undefined?` · RIR ${esc(p.rir)}`:''}`:'Még nincs előző adat'}</span>${p.ism&&editable?`<button class="copy" ${attrs} data-copy>Átvesz</button>`:''}</div>`}return `<section class="exercise"><div class="ex-head"><div class="ex-name">${esc(ex.name)}</div>${editable?`<button class="rest" data-rest="${esc(ex.name)}">Pihenő</button>`:''}</div><div class="col-head"><span>#</span><span>kg</span><span>ism.</span><span>RIR</span><span>kész</span></div><div class="set-wrap">${rows}</div></section>`}
function summary(s){return `<section class="summary"><h2>Edzés kész</h2><div class="sum-grid"><div class="metric"><span>Sorozat</span><strong>${s.sets}</strong></div><div class="metric"><span>Össz. ismétlés</span><strong>${s.reps}</strong></div></div><div class="summary-note">Ez lett az új „előző edzés”. A következő ${esc(day(s.dayId).name)} napon ezeket az értékeket fogod látni.</div></section>`}
function settingsView(){return `<main><h1 class="page-title">Beállítások</h1><p class="page-sub">Itt csak azt állítsd, ami tényleg kell az edzés közbeni logoláshoz.</p><section class="settings-card"><h2>Pihenő</h2><label class="helper">Alap pihenőidő</label><select id="rest-duration" class="edit">${[60,90,120,180].map(x=>`<option value="${x}" ${S.prefs.rest===x?'selected':''}>${x} másodperc</option>`).join('')}</select><label class="helper" style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="auto-rest" ${S.prefs.autoRest?'checked':''}> Kész sorozat után automatikusan induljon</label></section><section class="settings-card"><h2>Edzésterv</h2><p class="helper">A napok fixen az öt fő edzéstípus. A gyakorlatokat és a sorozatszámot módosíthatod.</p>${S.program.map((d,di)=>`<div class="settings-day"><strong>${esc(d.name)}</strong>${d.exercises.map((e,ei)=>`<div class="settings-ex"><input class="edit" value="${esc(e.name)}" data-edit="${di}:${ei}" data-field="name"><input class="edit" type="number" min="1" max="20" value="${e.sets}" data-edit="${di}:${ei}" data-field="sets"><div class="danger-actions" style="grid-column:1/-1"><button class="btn light" data-up="${di}:${ei}">↑</button><button class="btn light" data-down="${di}:${ei}">↓</button><button class="btn red" data-del="${di}:${ei}">Törlés</button></div></div>`).join('')}<div class="add-row"><input class="edit" placeholder="Új gyakorlat" data-new="${di}"><button class="btn primary" data-add="${di}">+ Add</button></div></div>`).join('')}</section><section class="settings-card"><h2>Adatmentés</h2><p class="helper">Az adatok a telefon/böngésző helyi tárhelyén maradnak. Biztonsági mentést JSON fájlba tudsz készíteni.</p><div class="btn-row"><button class="btn primary" id="export">Mentés letöltése</button><label class="btn light" for="import" style="display:grid;place-items:center">Mentés visszatöltése</label><input id="import" type="file" accept=".json,application/json" hidden></div></section></main>`}
function bnav(){return `<nav class="bnav"><button class="${S.view!=='settings'?'active':''}" data-home>Edzés</button><button class="${S.view==='settings'?'active':''}" data-settings>Beállítások</button></nav>`}
function valid(c){return c&&c.suly!==''&&c.suly!==undefined&&Number.isFinite(Number(c.suly))&&Number(c.suly)>=0&&Number.isInteger(Number(c.ism))&&Number(c.ism)>0}
function progress(d,draft){let done=0,total=0;for(const ex of d.exercises)for(let i=0;i<ex.sets;i++){total++;const c=draft[ex.name]?.[i];if(valid(c)&&c.done)done++}return{done,total}}
function ensureCell(dayId,ex,i){S.drafts[dayId]??={};S.drafts[dayId][ex]??=[];S.drafts[dayId][ex][i]??={suly:'',ism:'',rir:'',done:false};return S.drafts[dayId][ex][i]}
function startWorkout(){const d=day(S.activeDay);S.session={dayId:d.id,startedAt:new Date().toISOString()};S.drafts[d.id]={};S.lastSummary=null;save(true);render()}
function finishWorkout(){const d=day(S.activeDay),draft=S.drafts[d.id]||{},p=progress(d,draft);if(!p.done)return toast('Jelölj készre legalább egy sorozatot','warn');if(p.done<p.total&&!confirm(`${p.done}/${p.total} sorozat kész. Biztosan befejezed?`))return;let reps=0;const result={};for(const ex of d.exercises){for(let i=0;i<ex.sets;i++){const c=draft[ex.name]?.[i];if(valid(c)&&c.done){result[ex.name]??=[];result[ex.name][i]={suly:c.suly,ism:c.ism,rir:c.rir??''};reps+=Number(c.ism)}}}S.history[d.id]=result;S.drafts[d.id]={};S.session=null;S.timer={end:0,label:''};S.lastSummary={dayId:d.id,sets:p.done,reps};save(true);render();toast('Edzés lezárva ✓')}
function cancelWorkout(){if(!confirm('Megszakítod az edzést? A most beírt adatok törlődnek, az előző edzés megmarad.'))return;S.drafts[S.activeDay]={};S.session=null;S.timer={end:0,label:''};save(true);render()}
function startTimer(label){S.timer={end:Date.now()+S.prefs.rest*1000,label};save(true);render()}
function floatingTimer(){if(!S.timer.end)return'';return `<div class="timer ${S.timer.end<=Date.now()?'done':''}"><div><small>${esc(S.timer.label||'Pihenő')}</small><strong class="timer-time">${fmt(S.timer.end-Date.now())}</strong></div><div class="timer-actions"><button data-plus="30">+30</button><button id="stop-timer">Stop</button></div></div>`}
function fmt(ms){const sec=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function renderTimer(){if(!S.timer.end)return;const el=document.querySelector('.timer-time');if(el)el.textContent=S.timer.end<=Date.now()?'KÉSZ':fmt(S.timer.end-Date.now());document.querySelector('.timer')?.classList.toggle('done',S.timer.end<=Date.now())}
function scheduleTimer(){clearInterval(timerT);timerT=setInterval(renderTimer,500)}
function move(arr,i,dir){const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}
function attach(){
 document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{S.view='home';S.activeDay='';save(true);render();window.scrollTo(0,0)});
 document.querySelector('[data-settings]')?.addEventListener('click',()=>{S.view='settings';render();window.scrollTo(0,0)});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.activeDay=b.dataset.open;S.view='workout';S.lastSummary=null;save(true);render();window.scrollTo(0,0)});
 document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{if(S.session&&S.session.dayId!==b.dataset.switch)return;S.activeDay=b.dataset.switch;S.lastSummary=null;save(true);render()});
 document.getElementById('start')?.addEventListener('click',startWorkout);document.getElementById('finish')?.addEventListener('click',finishWorkout);document.getElementById('cancel')?.addEventListener('click',cancelWorkout);
 document.querySelectorAll('.set-inp').forEach(inp=>inp.addEventListener('input',()=>{const {day:did,ex,set,field}=inp.dataset,c=ensureCell(did,ex,+set);c[field]=inp.value;c.done=false;save(true);render()}));
 document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const {day:did,ex,set}=b.dataset,c=ensureCell(did,ex,+set);if(!valid(c))return toast('Adj meg súlyt és pozitív egész ismétlésszámot','warn');c.done=!c.done;if(c.done&&S.prefs.autoRest)S.timer={end:Date.now()+S.prefs.rest*1000,label:ex};save(true);render()});
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const {day:did,ex,set}=b.dataset,p=S.history[did]?.[ex]?.[+set];if(!p)return;const c=ensureCell(did,ex,+set);c.suly=p.suly;c.ism=p.ism;c.rir='';c.done=false;save(true);render();toast('Előző érték átvéve')});
 document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startTimer(b.dataset.rest));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{S.timer.end=Math.max(Date.now(),S.timer.end)+Number(b.dataset.plus)*1000;save(true);render()});document.getElementById('stop-timer')?.addEventListener('click',()=>{S.timer={end:0,label:''};save(true);render()});
 document.getElementById('rest-duration')?.addEventListener('change',e=>{S.prefs.rest=Number(e.target.value);save()});document.getElementById('auto-rest')?.addEventListener('change',e=>{S.prefs.autoRest=e.target.checked;save()});
 document.querySelectorAll('[data-edit]').forEach(inp=>inp.onchange=()=>{const[di,ei]=inp.dataset.edit.split(':').map(Number),ex=S.program[di].exercises[ei];if(inp.dataset.field==='sets')ex.sets=Math.max(1,Math.min(20,parseInt(inp.value)||1));else{const old=ex.name,n=inp.value.trim();if(!n)return render();ex.name=n;if(S.history[S.program[di].id]?.[old]&&old!==n){S.history[S.program[di].id][n]=S.history[S.program[di].id][old];delete S.history[S.program[di].id][old]}}save();render()});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const[di,ei]=b.dataset.up.split(':').map(Number);move(S.program[di].exercises,ei,-1);save();render()});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const[di,ei]=b.dataset.down.split(':').map(Number);move(S.program[di].exercises,ei,1);save();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const[di,ei]=b.dataset.del.split(':').map(Number);if(confirm('Törlöd ezt a gyakorlatot?')){S.program[di].exercises.splice(ei,1);save();render()}});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const di=+b.dataset.add,inp=document.querySelector(`[data-new="${di}"]`),n=(inp?.value||'').trim();if(!n)return;S.program[di].exercises.push({name:n,sets:2});save();render()});
 document.getElementById('export')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({format:'edzonaplo-simple',version:1,state:S},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='edzesnaplo-mentes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
 document.getElementById('import')?.addEventListener('change',async e=>{try{const x=JSON.parse(await e.target.files[0].text()),next=x.state||x;if(!next.program||!next.history)throw Error();if(!confirm('A visszatöltés lecseréli a jelenlegi helyi adatokat. Folytatod?'))return;S={...S,...next,prefs:{...S.prefs,...next.prefs}};save(true);render();toast('Mentés visszatöltve ✓')}catch(_){toast('Hibás mentésfájl','red')}})
}
load();render();
</script>
</body>
</html>
